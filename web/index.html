<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f0d" />
    <title>ToLaD: mammals</title>
    <!-- The tree's data (fan/mammals-data.ts, ToLaD#502): fetched with the page, not after its script has run.
         Every fossil's pair by default; ?fossils=old the old look's (ToLaD#279). The mammals', or with ?tree=amniotes
         the amniotes' (ToLaD#539); mammals-data.ts treeFiles names them the same way. -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'fetch'; l.type = 'application/json'; l.crossOrigin = 'anonymous';
        var tree = q.get('tree') === 'amniotes' ? 'amniotes' : 'mammals';
        l.href = tree + (q.get('fossils') === 'old' ? '' : '-all') + '.json';
        document.title = 'ToLaD: ' + tree;
        document.head.appendChild(l);
      })();
    </script>
    <style>
      html, body, #root { margin: 0; height: 100%; background: #0b0f0d; overflow: hidden; }
      body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
    </style>
  </head>
  <body>
    <div id="root"><div class="loading" role="status"><b>Tree of Life and Death</b><br />Every mammal, alive and dead: loading…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
