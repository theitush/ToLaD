# Build the single-file app and publish it on GitHub Pages (https://theitush.github.io/ToLaD/)
# on every push to main (ToLaD#239; Ita's call, as CLAUDE.md asks for any workflow).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:single
        working-directory: web
      # (The mammal level's data, mammals.json, is fetched by the page when that level opens: ToLaD#247;
      # globe.json and globe-draw.js, the card's range globe, when a card first shows one: ToLaD#267.)
      - name: Stage the page
        run: mkdir _site && cp web/dist-single/index.html web/dist-single/mammals.json web/dist-single/globe.json web/dist-single/globe-draw.js _site/ && touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
