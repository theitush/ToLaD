# Reptile counts (ToLaD#578): the reptiles a published number counts, read by the amniote build (amniotes.py,
# reptcounts.py). Every other reptile stays unknown (FLAG bit 11, drawn dashed): there is no reptile model.
#
# Ita, 2026-11-18: "dont fit but im sure some animals do have counts like i dunno the sea turtles for example".
#
# The rules:
# - Only species-level, global or near-global numbers: a survey, a census, a nesting index or an assessment's figure
#   for the whole species (`scope`). A partial one only where the source says it covers most of the range, marked.
# - The number is used as the source gives it (`counts` says what it counts: mature individuals, adult females, ...).
#   No conversion: a figure of females or of mature individuals is not turned into all ages, since no cited rule for
#   it exists (the IUCN Red List counts only mature individuals; a sea turtle survey counts the females that come
#   ashore). The card says what the number counts. The mammals' census tier is the same kind of figure (IUCN
#   population reports, mostly mature individuals, Greenspoon et al. 2023, model.py).
# - `n` is the source's figure. A source that gives only a range (`lo`-`hi`) has its geometric middle as `n`, set by
#   the build (reptcounts.py) and said in the method; `lo`-`hi` is then the range the row's error is drawn from.
# - A sum of a source's own parts (sea turtle populations) is that sum, said in `note`.
# - `grade` (A-D, the page's grades): B a survey of the whole wild population with a stated method; C an assessment's
#   or a status review's figure, or a count of one sex or of nesters only; D a rough bound.
# - `kind`: "census" (counted, or a survey estimate of the population) or "estimate" (an assessment's or an index's
#   figure). The card says "counted" for a census and "published estimate" for an estimate.
# - `cite` and `url` name the source the figure is from; `via` names where it was read when that is a summary of it
#   (the IUCN website refuses scripted reads, so the Red List figures were read through the pages named). `quote` is
#   the passage the figure was read from, verbatim.
#
# Looked for and not found (left unknown): a global count of loggerhead, hawksbill or flatback turtles (the
# sources give nesting females per site or region only); the blue iguana, Jamaican iguana, Round Island boa and
# Antiguan racer (figures seen only without a source); the black caiman and false gharial (their list figures
# looked wrong: 10,000 for a Least Concern Amazon caiman; the false gharial's equal to the Cuban crocodile's).

# ------------------------------------------------------------------ sea turtles

[[count]]
species = "Dermochelys coriacea"
n = 32174
counts = "adult females"
scope = "global: the seven populations' monitored beaches"
year = 2020
grade = "C"
kind = "estimate"
cite = "NMFS & USFWS (2020). Endangered and Threatened Wildlife; 12-Month Finding on a Petition To Identify the Northwest Atlantic Leatherback Turtle as a Distinct Population Segment. Federal Register 85 (154): 48332-48387, citing the Leatherback Status Review Team (2020)"
url = "https://www.govinfo.gov/content/pkg/FR-2020-08-10/pdf/2020-16277.pdf"
quote = "The total index of nesting female abundance for the NW Atlantic DPS is 20,659 females. ... for the SW Atlantic DPS is 27 females. ... for the SE Atlantic DPS is 9,198 females. ... of the SW Indian DPS is 149 females. ... of the NE Indian DPS is 109 females. ... of the West Pacific DPS is 1,277 females. ... for the East Pacific DPS is 755 females."
note = "The sum of the seven populations' indices (20,659 + 27 + 9,198 + 149 + 109 + 1,277 + 755). Each index is the nests laid over the latest remigration interval divided by the clutch frequency: the adult females that nest there, 'an index (rather than a census)', unmonitored beaches with few nesters left out. Males and juveniles are not counted."

