[project]
name = "tolad-pipeline"
version = "0.1.0"
description = "ToLaD offline data pipeline (v0: mammals)"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "brotli>=1.1",
    "numpy>=1.26",
]

[project.scripts]
tolad-fetch = "tolad_pipeline.fetch:main"
tolad-build = "tolad_pipeline.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tolad_pipeline"]
