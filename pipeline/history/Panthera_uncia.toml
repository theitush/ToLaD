species   = "Panthera uncia"
aliases   = ["Uncia uncia"]
common    = "Snow leopard"
component = "wild"
use       = "counts"
scope     = "global, all ages"
notes     = """
All global figures are compilations of national guesses: before PAWS, robust estimates covered
<2% of the range (GSLEP 2018), and 63 of 69 inputs to the 2017 assessment were expert opinion or
sign surveys. The rise from 2003 to 2017 is a change in guesses, not evidence of growth. PAWS
(Population Assessment of the World's Snow Leopards) national estimates are still being released
(Mongolia 953, Nepal 397, India 718) with no new global total yet.
Older totals grew with survey effort, not with snow leopards: Jackson 2002 (SLC / IUCN Cat
Specialist Group, https://catsg.org/_files/ugd/7a07e2_a83bd42544f041faadcb62995196a733.pdf):
"There is now general agreement that population estimates of around 2,000 made in the early
1970's ... are too low"; Green 1988 gave 1,604-2,880 and Fox 1989 3,350-4,050. Those are left out
as points (they would draw a false rise); Fox 1994 (4,510-7,350, Jackson 2002 Table 1) is kept.
The 2017 Red List's ~10% decline over three generations is a projection (to ~2040), not a past
decline, so it gives no earlier level. Range: Mahmood et al. 2019 (PLoS ONE 14:e0218460,
doi:10.1371/journal.pone.0218460) reconstruct a historical range of ~10.47 million km2 against
~3.20 million km2 now (~69% contraction), with no count attached. No sourced pre-decline count.
Small for a long time: Solari et al. 2025 (PNAS 122:e2502584122, doi:10.1073/pnas.2502584122)
find the lowest genetic diversity of any big cat, "likely due to a persistently small population
size throughout their evolutionary history" (effective size, not a census: notes only).
"""


[[point]]
year  = 1994
n     = 5930
lo    = 4510
hi    = 7350
grade = "C"
kind  = "estimate"
cite  = "Fox 1994, Snow leopard conservation in the wild: a comprehensive perspective on a low density and highly fragmented population, Proc. 7th International Snow Leopard Symposium (as tabulated in Jackson 2002, Snow Leopard Status, Distribution and Protected Areas Coverage, SLC / IUCN Cat Specialist Group)"
url   = "https://catsg.org/_files/ugd/7a07e2_a83bd42544f041faadcb62995196a733.pdf"
note  = "'Between 4,510 and 7,350 snow leopards within a total potential habitat area of 1,835,000 km2 (Fox 1994)': a sum of national estimates (Table 1), n = midpoint."

[[point]]
year  = 2003
n     = 5335
lo    = 4080
hi    = 6590
grade = "C"
kind  = "estimate"
cite  = "McCarthy et al. 2003, Snow Leopard Survival Strategy, Table II (via Japan Ministry of the Environment ESABII database)"
url   = "https://www.esabii.biodic.go.jp/database/mammal/carnivora/panthera_uncia.html"
note  = "Sum of national estimates updating Fox 1994; 'many of the estimates are acknowledged to be rough and out of date'. n = midpoint."

[[point]]
year  = 2017
n     = 7721
lo    = 7446
hi    = 7996
grade = "C"
kind  = "estimate"
cite  = "McCarthy et al. 2017, Panthera uncia, IUCN Red List e.T22732A50664030 (figures as given by the IUCN SSC Cat Specialist Group)"
url   = "https://doi.org/10.2305/IUCN.UK.2017-2.RLTS.T22732A50664030.en"
note  = "7,446-7,996 individuals, 2,710-3,386 mature (n = midpoint). Range reflects compilation only, true uncertainty much wider."

[deep]
method = "PSMC"
cite   = "Solari et al. 2025, PNAS 122:e2502584122, Fig. 3B (Mongolia, 29x, the thick green curve)"
url    = "https://doi.org/10.1073/pnas.2502584122"
mu     = 3.62e-09   # the curve's mutation rate, per site per generation (Armstrong et al. 2025 snow leopard pedigree rate)
g      = 5.0       # the curve's generation time, years
grade  = "D"
note   = "Digitised from the article PDF's raster of Fig. 3 (1028x1625 px; PMC12541318 open-access package): x calibrated on the tick marks (1e3, 1e4, 1e5, 1e6 yr at 124, 380.5, 637, 894 px: 256.7 px per decade), y on the grid lines (Ne 0-30,000 at 1539.5-933.5 px: 202 px per 10,000). Every column scanned for the curve's legend colour (111,203,42), within RGB distance 40; inside the grey LGM band (40-100 kyr) the colour is overlaid, so there by green dominance (G - max(R, B) > 10). A column whose matched pixels span <= 9 px is on a step; neighbouring columns within 2 px make one step; steps within 1.5 px in Ne and 3% in time merged. Reading error ~1 px: ~1% in time, ~50 in Ne. 316-560 kyr (the steep rise) is hidden under the other populations' curves; the build interpolates across it. The oldest bin (0.98-1.26 Myr, a drop from ~26,700 to ~19,000) is left out (Hilgers et al. 2025). Mongolia is the deepest-covered wild genome; captive (28x), India (12x) and Afghanistan (9x) agree with it (level x1.03, x0.89, x0.80 over 20-670 kyr after the rescale; log-residual <= x1.11). ToLaD#66 replaced Armstrong et al. 2025 Fig. 4 (green curve, same rate and g): it is the captive genome (SRR12437590), its time axis is in generations (g = 1; see Panthera_leo.toml), and it reaches only ~130,000 generations with a false oldest peak, so it gave three points. Agreeing (level of the other curve against this one after the same rescale, 20 kyr to the older end; log-residual): Cho et al. 2013 Fig. 4b (6.5e-9/gen) x0.93, x1.10; Figueiro et al. 2017 Fig. 1B (1.0e-8/gen) x0.82, x1.14; Bergman et al. 2023 Supplementary Data 3 (9.01e-9/gen, DNA Zoo = the captive genome) x0.88, x1.18; Armstrong 2025 green x0.83, x1.17 over 20-94 kyr as published (g = 5), x0.57, x1.23 over 20-470 kyr read as g = 1: this panel alone does not show the time offset of the others (its curve rises steadily over the short span it covers, so time and level trade off). Cross-check charts: .claude/handoff/previews/psmc66-shots/Panthera_uncia.png (local)."
