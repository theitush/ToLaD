species   = "Eschrichtius robustus"
common    = "Gray whale"
component = "wild"
use       = "counts"
scope     = "global, all ages; points from 1968 are the eastern North Pacific stock, nearly the whole species"
notes     = "The North Atlantic population was extinct by the 18th century. Eastern North Pacific (ENP) whales were hunted in the Baja lagoons from 1846 and again in the early 20th century; the western North Pacific remnant numbers only a few hundred, so ENP counts (NOAA shore-based counts off central California since 1967/68; each season Dec-Feb is dated by its January) are used as the species curve. ENP had unusual mortality events in 1999-2000 and 2019-2023."

