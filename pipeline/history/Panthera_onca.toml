# Bottlenecks (ToLaD#141): each window in years before present (2026), quoted from a source that was read.
[[event]]
kind = "bottleneck"
from_ya = 300000
to_ya = 30000
title = "Pleistocene decline"
scope   = "species"
scope_why = "the species' own genome-wide history"
summary = "Genetic (PSMC): of all the big cats the jaguar was hit hardest by the decline that began 300,000 to 100,000 years ago, levelling off about 30,000 years ago at the lowest effective size of any living big cat."
quote = "PSMC results (Fig. 1B) revealed population reductions in all five species ca. 100,000 to 300,000 years ago, and a second round of decline (most notably for the lion and leopard) between 10,000 and 20,000 years ago, following the last glacial maximum. In the period between these two rounds of decline, the inferred patterns differ among species, with the leopard showing a rebound ca. 100,000 years ago, whereas the lion and snow leopard remained mostly stable (although at very different effective sizes). The jaguar was the most negatively influenced by the initial decline, stabilizing ca. 30,000 years ago at the lowest effective population size among the extant big cats."
cite = "Figueiró HV, Li G, Trindade FJ, et al. (2017). Genome-wide signatures of complex introgression and adaptive evolution in the big cats. Sci Adv 3:e1700299"
url = "https://doi.org/10.1126/sciadv.1700299"
grade = "C"
