species   = "Balaena mysticetus"
common    = "Bowhead whale"
component = "wild"
use       = "counts"
scope     = "global, all ages"
notes     = "Commercial whaling from 1611 (Spitsbergen) through the 19th century (Davis Strait, Bering-Chukchi-Beaufort) left all stocks severely depleted; only aboriginal subsistence hunting continues. The Bering-Chukchi-Beaufort stock, the largest, was 12,505 in 2019 (Givens et al. 2021, J. Cetacean Res. Manage. 22:61-73, doi:10.47536/jcrm.v22i1.230) and grew ~3.7%/yr 1978-2011; the Svalbard and Okhotsk stocks remain small. A 'pre-whaling 50,000' figure on Wikipedia has no visible source and is not used."

