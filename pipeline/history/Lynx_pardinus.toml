from_ya = 76
to_ya = 24
title = "Fewer than 100 left"
summary = "Census: a steep decline in the second half of the 20th century left under 100 lynx (under 62 mature) in two isolated Andalusian populations by 2002; conservation has since brought numbers back above 2,000."
quote = "a steep decline during the second half of the 20th century left less than 100 lynx (less than 62 mature) distributed in the two isolated populations of Doñana and Andújar (Sierra Morena) in Andalusia, southern Spain, leading to its recognition as the most endangered felid in the world [8] and to its classification as “critically endangered” in the 2002, 2006, and 2008 IUCN red lists."
cite = "Abascal F, Corvelo A, Cruz F, et al. (2016). Extreme genomic erosion after recurrent demographic bottlenecks in the highly endangered Iberian lynx. Genome Biol 17:251"
