species   = "Lynx pardinus"
common    = "Iberian lynx"
component = "wild"
use       = "counts"
scope     = "global (Spain and Portugal), wild, all ages unless a point says otherwise; 1988 and 1997 are Spain only"
notes     = """
The best-documented cat recovery. A questionnaire survey of Spain put about 1,100 lynx in 48 nuclei
in 1987-88 (Rodriguez & Delibes 1992); rabbit haemorrhagic disease (from the late 1980s), on top of
myxomatosis, hunting and habitat loss, halved that by the late 1990s, and the 2000-2002 camera-trap
and scat census found fewer than 100 in two isolated Andalusian nuclei (Donana-Aljarafe and
Andujar-Cardena). Captive breeding (from 2005) and reintroductions (LIFE Iberlince, LIFE
Lynxconnect: Guarrizas, Guadalmellato, Montes de Toledo, Matachel, Vale do Guadiana in Portugal)
took the census to 2,401 in 2024. The IUCN moved it from Critically Endangered (2002-2008) to
Endangered (2015) and Vulnerable (2024); a favourable status is put at 3,000-3,500 lynx (750
breeding females). Mature individuals, for comparison: 62 in 2001, 648 in 2022 (IUCN 2024
assessment, as quoted by the Cat Specialist Group and the press). Range: about 80% of the
early-1960s range was lost by 2000 (Alda et al. 2008; Gil-Sanchez & McCain 2011, J Mammal
92:1081). No cited count before 1988: before it the build uses the modelled natural level, the 2024 census
times the PHYLACINE range ratio (950,000 / 37,000 km2 = 25.5), ~61,000 in 1500 (grade D). The census
now covers reintroduction areas outside that current map, so the ratio and this level are probably
too high; the model's own count (about 160) would have given ~4,000.
"""

