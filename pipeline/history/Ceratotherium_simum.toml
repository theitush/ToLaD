species   = "Ceratotherium simum"
common    = "White rhinoceros"
component = "wild"
use       = "counts"
scope     = "Africa (whole species range), all ages; southern and northern white rhino combined"
notes     = "No baseline: no traceable pre-decline total for the species. The southern white rhino was reduced to fewer than ~50 animals in the Hluhluwe-iMfolozi area by the end of the 19th century (widely cited), but the northern subspecies then numbered far more and no species total exists for that date. The northern white rhino is now functionally extinct (2 females, captive in Kenya). AfRSG counts are continental, from national rhino surveys."

