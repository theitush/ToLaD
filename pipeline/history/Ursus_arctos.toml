species   = "Ursus arctos"
common    = "Brown bear"
component = "wild"
use       = "counts"
scope     = "global, all ages"
notes     = """
Only one species-wide estimate was found. The brown bear's losses were regional (e.g. grizzlies in
the lower-48 USA, much of Europe, the Middle East and North Africa) while Russia (>100,000), Alaska
and Canada kept large populations; no sourced pre-decline global total exists, so there is no
baseline. Country breakdown in the source: Russia >100,000, USA ~33,000, Canada ~25,000, Europe
~15,400.

Bottlenecks ([[event]], ToLaD#147): the Scandinavian hunting low (~100 years before 2015, Xenikoudakis et al. 2015) is regional and not in the data (global column, one point in 2017).
"""

[[event]]
kind    = "bottleneck"
from_ya = 146
to_ya   = 96
title   = "Scandinavian hunting low"
scope   = "regional"
scope_why = "Scandinavia's bears, a few % of a Holarctic species"
summary = "Intense hunting cut the Scandinavian brown bear to a small remnant around 100 years ago; protected, it has recovered to thousands. Museum and modern DNA show a fall in effective size across the bottleneck."
quote   = "The Scandinavian brown bear went through a major decline in population size approximately 100 years ago, due to intense hunting. After being protected, the population subsequently recovered and today numbers in the thousands. ... Approximate Bayesian computations provided clear support for a decline in effective population size during the bottleneck, in both the southern and northern subpopulations."
cite    = "Xenikoudakis G, Ersmark E, Tison JL, et al. (2015). Consequences of a demographic bottleneck on genetic structure and variation in the Scandinavian brown bear. Mol Ecol 24:3441-3454"
url     = "https://doi.org/10.1111/mec.13239"
grade   = "C"
region  = "Scandinavia"

[[point]]
year  = 2017
n     = 200000
lo    = 200000
hi    = 200000
grade = "C"
kind  = "estimate"
cite  = "McLellan, Proctor, Huber & Michel 2017, Ursus arctos, IUCN Red List e.T41688A121229971"
url   = "https://doi.org/10.2305/IUCN.UK.2017-3.RLTS.T41688A121229971.en"
note  = "Global population 'exceeds 200,000' (a lower bound; quoted by San Diego Zoo Wildlife Alliance and Cambridge-published papers)."
