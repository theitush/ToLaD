species   = "Vicugna vicugna"
aliases   = ["Lama vicugna"]
common    = "Vicuna"
component = "wild"
use       = "counts"
scope     = "global (Peru, Bolivia, Argentina, Chile, Ecuador), all ages, wild and community-managed"
notes     = """
The pre-Conquest ~2 million is an unattributed figure (grade D). The 1960s low is given as ~6,000 by
1965 (Lichtenstein & Vila 2003) or 10,000 in a 1969 census (CONACS case study); a CITES sheet gives
'400,000 in the 1950s', also unsourced. The 2012 IUCN camelid group total's country figures do not
sum consistently. Later totals of ~350,000-520,000 were not traced to a primary source and are left
out.
"""

[baseline]
year  = 1530
n     = 2000000
lo    = 2000000
hi    = 2000000
grade = "D"
kind  = "unverified"
cite  = "CONACS (Peru) case study by A. Tovar for D. Hoces, 1997, hosted on Yale's solutions-site.org"
url   = "https://solutions-site.org/node/116"
note  = "'It has been estimated that the total population of vicuna prior to Spanish conquest was about 2 million head'; no source for the estimate. Widely repeated."

[[point]]
year  = 1965
n     = 6000
lo    = 6000
hi    = 10000
grade = "C"
kind  = "estimate"
cite  = "Lichtenstein & Vila 2003, Vicuna use by Andean communities: an overview, Mountain Research and Development 23(2):197-201"
url   = "https://bioone.org/journals/mountain-research-and-development/volume-23/issue-2/0276-4741(2003)023[0197:VUBACA]2.0.CO;2/Vicuna-Use-by-Andean-Communities-An-Overview/10.1659/0276-4741(2003)023[0197:VUBACA]2.0.CO;2.full"
note  = "'Reducing the world population to approximately 6000 individuals by 1965'; hi = 10,000 from a 1969 census quoted by CONACS."

[[point]]
year  = 2003
n     = 200000
lo    = 200000
hi    = 200000
grade = "C"
kind  = "estimate"
cite  = "Lichtenstein & Vila 2003, Mountain Research and Development 23(2):197-201"
url   = "https://bioone.org/journals/mountain-research-and-development/volume-23/issue-2/0276-4741(2003)023[0197:VUBACA]2.0.CO;2/Vicuna-Use-by-Andean-Communities-An-Overview/10.1659/0276-4741(2003)023[0197:VUBACA]2.0.CO;2.full"
note  = "'Now the world population is at approximately 200,000.'"

[[point]]
year  = 2012
n     = 347273
lo    = 343499
hi    = 397893
grade = "C"
kind  = "census"
cite  = "IUCN SSC South American Camelid Specialist Group (GECS) totals as of 23 Oct 2012, reposted on solutions-site.org"
url   = "https://solutions-site.org/node/116"
note  = "Sum of national counts (Peru 188,327, Argentina 72,678 or 127,072, Bolivia 62,869, Chile 16,942, Ecuador 2,683); lo/hi are the two possible country sums."
