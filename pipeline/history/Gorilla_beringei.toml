scope     = "global, all ages; sum of Grauer's gorilla (G. b. graueri) and mountain gorilla (G. b. beringei) figures from separate sources"
notes     = "Whole-species totals are sums of subspecies figures from different surveys and years; the mountain gorilla adds only ~4% (1990s) to ~22% (2010s). Grauer's gorillas fell ~77% in one generation during the DRC wars (Plumptre et al. 2016). Mountain gorillas rose from ~620 (1989/1997) to 1,063 (2016/2018). No earlier species total is used: Emlen & Schaller's 1959 range-wide survey gave no comparable number here."

