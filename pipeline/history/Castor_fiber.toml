species   = "Castor fiber"
common    = "Eurasian beaver"
component = "wild"
use       = "counts"
scope     = "global, all ages; minimum estimates (sum of national estimates, lower limits)"
notes     = """
Overhunting left ~1,200 animals in 8 refugia from France to Mongolia around 1900. All later totals
are 'minimum population estimates' from summing national figures with the same method, so they
understate the true number. No sourced pre-decline level exists, so there is no baseline.
Introduced North American beavers in Finland and Russia are excluded.
"""

[[point]]
year  = 1900
n     = 1200
lo    = 1200
hi    = 1200
grade = "C"
kind  = "estimate"
cite  = "Halley, Saveljev & Rosell 2021, Population and distribution of beavers Castor fiber and Castor canadensis in Eurasia, Mammal Review 51:1-24"
url   = "https://doi.org/10.1111/mam.12216"
note  = "'A century ago, overhunting had reduced Eurasian beaver populations to c. 1200 animals in scattered refugia.'"

[[point]]
year  = 1998
