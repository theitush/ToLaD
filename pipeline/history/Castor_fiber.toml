hi    = 423000
grade = "C"
kind  = "estimate"
cite  = "Nolet & Rosell 1998, Biological Conservation 83:165-173; value via Halley et al. 2021 (current minimum is 3.5x the 1998 estimate)"
url   = "https://doi.org/10.1111/mam.12216"
note  = "First modern estimate; n = 1,479,863 / 3.5 as stated by Halley et al. 2021, not read from the 1998 paper."

