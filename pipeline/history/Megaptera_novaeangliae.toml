species   = "Megaptera novaeangliae"
common    = "Humpback whale"
component = "wild"
use       = "counts"
scope     = "global, all ages"
notes     = "Hunted from the 19th century and heavily in the 20th; protected worldwide in 1966. Regional reconstructions show deep lows, e.g. western South Atlantic ~27,000 (1830) to ~450 (mid-1950s) to ~25,000, 93% recovered (Zerbini et al. 2019, R. Soc. Open Sci.). Genetic (Ne-based) pre-whaling numbers (Roman & Palumbi 2003, North Atlantic ~240,000) are 3-10x catch-based ones and are not used. IUCN 2018: Least Concern."

