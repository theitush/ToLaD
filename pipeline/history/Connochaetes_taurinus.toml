species   = "Connochaetes taurinus"
common    = "Blue wildebeest"
component = "wild"
use       = "counts"
scope     = "global, all ages, all subspecies (incl. white-bearded wildebeest, C. t. mearnsi / albojubatus)"
notes     = "No baseline: there is no species-wide pre-decline total. The Serengeti-Mara migratory population (~70% of the species) grew strongly after rinderpest was controlled in the 1960s (Serengeti census series from 1958; not used here because it is regional). Totals come mainly from aerial surveys compiled by the IUCN SSC Antelope Specialist Group."

