species   = "Eubalaena australis"
common    = "Southern right whale"
component = "wild"
use       = "counts"
scope     = "global (Southern Hemisphere), all ages"
notes     = "Some 150,000 were killed 1770-1900 (open-boat whaling); illegal Soviet catches of 3,212 in the 1960s slowed recovery. Populations have grown ~7%/yr since. Figures here come mainly through the South African mammal Red List account (Vermeulen et al. 2016), which cites IWC 2001 (J. Cetacean Res. Manage. Special Issue 2:1-60). The widely quoted 2009 total could not be traced to its IWC primary report. Christensen's 'right whale' figure lumps three Eubalaena species and is not used."

[baseline]
year  = 1770
n     = 62500
lo    = 55000
hi    = 70000
grade = "C"
kind  = "reconstruction"
cite  = "Vermeulen et al. 2016, Red List of Mammals of South Africa, Swaziland and Lesotho: Eubalaena australis (SANBI & EWT), after IWC 2001"
url   = "https://ewt.org/wp-content/uploads/2024/10/11.-Southern-Right-Whale-Eubalaena-australis_LC.pdf"
note  = "'Estimated at 55,000-70,000 individuals in 1770' (catch-based). n is the midpoint, set here."

