species   = "Panthera leo"
common    = "Lion"
component = "wild"
use       = "counts"
scope     = "global wild lions; African totals (Asiatic lions add ~3-4%, see notes); recent figures exclude cubs"
notes     = """
The 1950 and 1975 figures are widely repeated round numbers with no traceable survey behind them
(grade D). Modern estimates (2002-) are sums of site estimates of very mixed quality. Asiatic lions
(Gir, India): 674 in 2020 and 891 in the May 2025 Gujarat census, not added to the African totals.
IUCN 2016 (Bauer et al.) gave 23,000-39,000 mature individuals and a ~43% decline over 1993-2014.
Bauer et al. 2015 (PNAS, doi:10.1073/pnas.1500664112) gives regional trends since 1990.
"""

[baseline]
year  = 1950
n     = 500000
lo    = 400000
hi    = 500000
grade = "D"
kind  = "unverified"
cite  = "Hazzah, Borgerhoff Mulder & Frank 2009, Biological Conservation 142:2428-2437 (historical series, as quoted by San Diego Zoo Wildlife Alliance)"
url   = "https://doi.org/10.1016/j.biocon.2009.06.006"
note  = "'1950: 500,000'; the variant '400,000 in the 1950s' circulates in media and NGO pages. No survey underlies either figure."

[[point]]
year  = 1975
n     = 200000
lo    = 200000
hi    = 200000
grade = "D"
kind  = "unverified"
cite  = "Hazzah, Borgerhoff Mulder & Frank 2009, Biological Conservation 142:2428-2437 (as quoted by San Diego Zoo Wildlife Alliance)"
url   = "https://doi.org/10.1016/j.biocon.2009.06.006"
note  = "'1975: 200,000' in the same series; often attributed to Myers 1975, not traced to a count."

[[point]]
year  = 2002
n     = 23000
lo    = 16500
hi    = 30000
grade = "C"
kind  = "estimate"
cite  = "Bauer & Van Der Merwe 2004, Inventory of free-ranging lions Panthera leo in Africa, Oryx 38:26-31"
url   = "https://doi.org/10.1017/S0030605304000055"
note  = "Conservative continental inventory; inputs range from educated guesses to individually known populations."

[[point]]
year  = 2012
n     = 33500
lo    = 32000
hi    = 35000
grade = "B"
kind  = "estimate"
cite  = "Riggio et al. 2013, The size of savannah Africa: a lion's (Panthera leo) view, Biodiversity and Conservation 22:17-35"
url   = "https://doi.org/10.1007/s10531-012-0381-4"
note  = "32,000-35,000 free-ranging lions in 67 lion areas (n = midpoint)."

[[point]]
year  = 2024
n     = 23500
lo    = 22000
hi    = 25000
grade = "C"
kind  = "estimate"
cite  = "Nicholson, Bauer et al. 2025, Panthera leo, IUCN Red List e.T15951A280792135 (as quoted by San Diego Zoo Wildlife Alliance)"
url   = "https://doi.org/10.2305/IUCN.UK.2025-2.RLTS.T15951A280792135.en"
note  = "'Roughly 22,000 to 25,000 subadults and adults' in Africa (n = midpoint); cubs and ~891 Asiatic lions not included. Reported 25% continent-wide decline 2006-2018."

[deep]
method = "PSMC"
cite   = "Armstrong et al. 2025, Genome Biol Evol 17(4):evaf060, Fig. 4 (green curve)"
url    = "https://doi.org/10.1093/gbe/evaf060"
mu     = 5.42e-09   # the curve's mutation rate, per site per generation
g      = 1.0       # the curve's generation time as plotted: g = 1, so its time axis is in generations (ToLaD#66)
grade  = "D"
note   = "Digitised from the published raster of Fig. 4 (PMC11997302, evaf060f4.jpg, 800x485 px): axes calibrated on the tick marks (x: 1e3-1e6 yr, log, ~60.5 px per decade; y: Ne 0-150,000, linear, ~49 px per 50,000), then every column of the panel scanned for the curve's colour; a column with one short run (<= 4 px) is on a step, neighbouring columns within 1.5 px make one step. Each step is [from, to] years ago and its Ne, in the figure's own scaling. Reading error ~1 px: ~4% in time, ~1,000 in Ne (so ~20% at Ne 5,000). PSMC run with -p 2+2+25*2+4+6 (Hilgers et al. 2025), g = 5 yr. Read: the green curve: the lion pedigree rate (5.42e-9/gen, Fig. 2). Time axis in generations (ToLaD#66): the methods give generation time five years, 'provided as a g = 1 for this particular scaling script' (psmcr), and other genomes' PSMC curves line up with this figure's only when its times are multiplied by ~5 (lion: x4.4-5.3 against five curves; jaguar, the same genome in Bergman et al. 2023: x5.5; tiger x6-9), so g = 1 here; Ne does not depend on g. Cross-check after the same rescale (level of the other curve against this one, 20 kyr to the older end, and the log-residual left after that level): Bergman et al. 2023 Supplementary Data 3 (PanLeo reference lion, 8.41e-9/gen) x1.25, residual x1.13; Cho et al. 2013 Fig. 4b African lion (4.5e-9/gen) x1.17, x1.12, and white lion x1.05, x1.14; Figueiro et al. 2017 Fig. 1B (1.0e-8/gen) x0.84, x1.25; de Manuel et al. 2020 Fig. 3A southern lineage (4.5e-9/gen) x1.17, x1.17: all agree (read as g = 5 they sit x0.5-0.75 below with residual x1.4). de Manuel's northern (Barbary) lion disagrees in shape (x0.67, residual x2.2: a deep bottleneck ~30-60 kyr ago, as published; another lineage). Kept as the best curve: the same shape as the others, and the deepest pedigree-based rate."
# [years ago from, to, Ne] as published (young to old); the build rescales and converts them
steps  = [
  [810, 940, 5700],
  [1050, 2430, 5700],
  [2830, 3430, 9300],
  [3700, 4820, 14400],
  [5010, 5400, 20100],
  [5830, 6790, 20300],
  [6790, 15660, 22600],
  [15660, 19670, 25000],
  [19670, 23780, 26800],
  [23780, 32230, 29100],
  [32230, 80220, 30900],
  [80220, 100760, 34400],
  [104660, 121840, 39100],
  [131460, 153040, 45500],
  [165130, 185060, 53400],
  [192230, 223780, 63700],
  [260510, 291970, 76200],
  [353060, 411010, 96000],
  [426920, 497000, 99300],
  [516250, 600990, 96500],
  [648440, 878780, 86200],
  [1146540, 1334730, 70300],
]

# PSMC's blind spot (ToLaD#143): a source dating a decline there keeps the curve's steps younger than
# 20 kyr (rescaled), grade D, instead of joining across them (see README, "PSMC's blind spots").
[deep.blind]
cite   = "Figueiro et al. 2017, Sci Adv 3:e1700299, Results (PSMC, Fig. 1B)"
url    = "https://doi.org/10.1126/sciadv.1700299"
quote  = "a second round of decline (most notably for the lion and leopard) between 10,000 and 20,000 years ago, following the last glacial maximum"
window = [10000, 20000]   # years before present, as the source dates it (its own PSMC scaling)
note   = "Figueiro's lion PSMC (Fig. 1B) is one of the five curves this file's [deep] note cross-checks (x0.84, residual x1.25); this curve's own steps younger than 20 kyr fall from Ne 20,100 to 5,700 (published scaling). Quote checked against the full text by the #141 bottleneck research (research/bottlenecks.md)."
