species   = "Puma concolor"
common    = "Puma"
component = "wild"
use       = "counts"
scope     = "global, all ages (a modelled estimate: no census or agency total exists)"
notes     = """
No global count exists. The IUCN assessment (Nielsen et al. 2015, errata 2016, Least Concern,
decreasing) lists the total as unknown and gives only regional figures, all old: Canada
3,500-5,000 and the western US 10,000 in the early 1990s (Caso et al. 2008 assessment, quoting
Nowell & Jackson 1996); the largest subpopulation, in South America, has never been quantified. So
the only global figure is a model, Greenspoon et al. 2023 (per-species biomass / body mass, the same
figure the model uses for today's count), graded D below. Densities range 0.5-7 per 100 km2 (IUCN
SSC Cat Specialist Group); 777,000 over the 26.2 million km2 PHYLACINE current range is ~3 per
100 km2, inside that range, so the model's level is not shown to be far too high.

History, regional only (not points: the curve is global): pumas were eliminated from most of the
eastern half of the US in the two centuries after European colonisation and by 1930 were gone east
of the Rocky Mountains in the US and Canada except Florida (Cat Specialist Group); the US Fish and
Wildlife Service declared the eastern cougar extinct in 2018. In the western US they have generally
recovered since bounties ended (mid-20th century) and are recolonising the Dakotas, Nebraska and
the Midwest. Florida panther: a remnant of a few dozen by the early 1990s, augmented with eight Texas
females in 1995, now estimated at 100-180 (Cat Specialist Group).

Deep past: the bulk PSMC curve (Bergman et al. 2023; the DNA Zoo PumCon1.0 genome of Saremi et al.
2019, Nat Commun 10:4769) ends ~25 kyr ago at ~40,000 (Ne/N = 0.1) and is joined to the modelled
natural level in 1500 (~1.0M), 26x higher (flagged, #77). No cited global level before 1900
exists, so the curve keeps its own level (ToLaD#94). Part of the low is real: North American
pumas descend from a small group that recolonised from South America after the late-Pleistocene
extinctions (~10-12 kyr ago; Culver et al. 2000, J Hered 91:186), and North and South American
lineages split 300-100 kyr ago (Saremi et al. 2019), so one genome samples one region's ancestry;
the rest is the generic Ne/N ratio of 0.1, which a species with long-range dispersal and strong
structure need not follow.

Bottlenecks ([[event]], ToLaD#141): the last-glacial low (Saremi et al. 2019, 25-20 kyr ago) is where
the curve's last genomic points are (~37,000 at 23.5 kyr ago); the North American refounding (Culver
et al. 2000, ~10 kyr ago) falls in PSMC's blind spot (< 20 kyr), so the curve cannot show it: the
mark stands on the source alone. Saremi et al. 2019 read their genomes as pumas persisting in North
America, not a late-Pleistocene replacement, so that event is graded D.
"""

[[event]]
kind    = "bottleneck"
from_ya = 25000
to_ya   = 20000
title   = "Last-glacial low"
summary = "Puma numbers in both Americas fell from a peak about 130,000 years ago through the last ice age, reaching their small present-day size by its coldest point, 25,000-20,000 years ago. Read from ten puma genomes."
quote   = "Populations on both continents were largest around 130 kya, during the warmest part of Marine Isotope Stage (MIS) 5, and then declined throughout the colder MIS 4–2, with populations reaching their current small sizes by the peak of the last ice age 25–20 kya."
cite    = "Saremi NF, Supple MA, Byrne A, et al. (2019). Puma genomes from North and South America provide insights into the genomic consequences of inbreeding. Nat Commun 10:4769"
url     = "https://doi.org/10.1038/s41467-019-12741-1"
grade   = "C"
region  = "North and South America"

[[event]]
kind    = "bottleneck"
from_ya = 12000
to_ya   = 9000
title   = "North American refounding"
summary = "North American pumas are genetically near-uniform: they look descended from a few founders from South America who recolonised the continent around 10,000 years ago, after the late-Pleistocene extinctions. Contested: whole genomes (Saremi et al. 2019) fit pumas persisting in North America better."
quote   = "The marked uniformity of mtDNA and a reduction in microsatellite allele size expansion indicates that North American pumas derive from a recent (late Pleistocene circa 10,000 years ago) replacement and recolonization by a small number of founders who themselves originated from a centrum of puma genetic diversity in eastern South America 200,000-300,000 years ago."
cite    = "Culver M, Johnson WE, Pecon-Slattery J, O'Brien SJ (2000). Genomic ancestry of the American puma (Puma concolor). J Hered 91:186–197"
url     = "https://doi.org/10.1093/jhered/91.3.186"
grade   = "D"
region  = "North America"

[[point]]
year  = 2023
n     = 776691
lo    = 520000
hi    = 1133000
grade = "D"
kind  = "estimate"
cite  = "Greenspoon et al. 2023, The global biomass of wild mammals, PNAS 120:e2204892120 (per-species estimate, results/wild_land_mammal_biomass.csv: 41.9 Gg, 28.1-61.2 Gg, / adult mass 53.95 kg)"
url   = "https://doi.org/10.1073/pnas.2204892120"
note  = "A model, not a count: a regression of density on body mass and trophic level, times the IUCN range area, fitted on species with census data. n = the pipeline's alive-now from this source (the build applies its own occupancy fit); lo/hi = the source's biomass range over the adult mass (28.07 / 61.16 Gg over 53.95 kg). Grade D: no census or agency figure to check it against."
