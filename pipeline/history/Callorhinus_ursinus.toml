species   = "Callorhinus ursinus"
common    = "Northern fur seal"
component = "wild"
use       = "display"
scope     = "Eastern Pacific stock (Pribilof Islands, plus Bogoslof since the 1980s), all ages; roughly half the world population"
notes     = "Regional only, so display. Most of the world population breeds on the Pribilofs; the rest in Russia (Commander, Kuril, Robben, Tyuleniy islands) and California. Worldwide ~1.1 million, about half on the Pribilofs (Encyclopedia of Marine Mammals, 2nd ed. 2008, Northern fur seal, pp. 788-791). Pelagic and land sealing cut the herd to an extreme low c. 1911 (~70,000 pups per year by one account); the 1911 Fur Seal Treaty let it grow ~8.6%/yr 1912-1924. NOAA designated the stock depleted in 1988 (below 50% of late-1950s levels). No traceable pre-exploitation (pre-1786) figure was found, so there is no baseline."

