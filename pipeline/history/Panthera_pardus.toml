species   = "Panthera pardus"
common    = "Leopard"
component = "wild"
use       = "display"
scope     = "India only (about 70% of Indian leopard habitat sampled); NOT a global count"
notes     = """
No global leopard population estimate exists (IUCN 2023 and San Diego Zoo fact sheet: 'population
sizes difficult to quantify'). The only continental figure, ~700,000 (600,000-850,000) for
sub-Saharan Africa from Martin & de Meulenaer 1988 (CITES; rainfall/habitat model, presented 1987),
is widely judged a gross overestimate (IUCN 2008: 'calculation was reportedly flawed'), so it is
left out. The points below are India's national camera-trap estimates, shipped for display only.
"""

