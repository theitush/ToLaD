notes     = "Survey coverage changed a lot: Wich et al. 2008 (Oryx 42:329-339) gave c. 6,600 (6,624) for 2004, and Wich et al. 2016 (Science Advances 2:e1500789) gave 14,613 for 2015 (13,846 after the Tapanuli split); the authors say the rise reflects wider survey effort, not growth. The 2004 point is left out as not comparable. Singleton et al. 2008 (IUCN) report a decline of over 80% in 75 years. The 2016 PHVA gave 14,470, including Tapanuli."

