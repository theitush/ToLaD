species   = "Phascolarctos cinereus"
common    = "Koala"
component = "wild"
use       = "counts"
scope     = "global (Australia), all ages"
notes     = "Recent national totals are not comparable over time: the CSIRO National Koala Monitoring Program (NKMP) estimate rose from 224,000-524,000 (2024 release; other outlets quote 287,830-628,010 for 2023) to 729,000-918,000 (2025), which CSIRO says may reflect more survey effort, more sensitive methods and model changes rather than real growth. The Australian Koala Foundation disputes these and holds that fewer than 100,000 remain. Historical context: a six-month open season in Queensland in 1919 produced about one million skins (a harvest, not a population)."

