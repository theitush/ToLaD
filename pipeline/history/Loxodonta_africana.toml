species   = "Loxodonta africana"
common    = "African savanna elephant"
component = "wild"
use       = "counts"
scope     = "global, all ages; points before 2014 are continental totals for both African elephant species, split to savanna by a stated regional assumption"
notes     = "Savanna and forest elephants have been assessed as separate species only since 2021, so older continental totals combine both. Split assumption for all points before 2014 (1800, 1900, 1930, 1979, 1989): the savanna share is the non-Central-African share (55%) of the ITRG 1989 regional split (45% in the Central African rainforests, 31% Southern, 21% East, 3% West). This misplaces Central African savanna elephants (Chad, CAR, north Cameroon) and West African forest elephants, so those points are grade D. The 1800-1930 figures are also unverified popular figures. The 2015 point counts Eastern + Southern Africa as savanna. Edwards et al. 2024 (PNAS, doi:10.1073/pnas.2403816121) find savanna site densities fell ~70% over 1964-2016 (southern Africa +42%)."

[baseline]
year  = 1800
n     = 1.43e7
lo    = 1.43e7
hi    = 1.43e7
grade = "D"
kind  = "unverified"
cite  = "US Fish and Wildlife Service, African Elephant Conservation Fund, 'What we do'"
url   = "https://www.fws.gov/program/african-elephant-conservation-fund/what-we-do"
note  = "'During the eighteenth century, the African continent may have contained as many as 26 million elephants' (both species), times the assumed 55% savanna share: 2.6e7 x 0.55 = 1.43e7. Widely repeated (FWS, National Geographic education pages; 20-27 M variants elsewhere) with no stated method; research/05 traces it to carrying-capacity and ivory-export reasoning. 'As many as' makes it an upper-end figure."

