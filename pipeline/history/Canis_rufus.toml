species   = "Canis rufus"
common    = "Red wolf"
component = "wild"
use       = "counts"
scope     = "global, wild (eastern North Carolina Red Wolf Population), all ages; the ~295 captive (SAFE) wolves not counted"
notes     = """
Declared extinct in the wild in 1980 after the last wolves were captured in Texas and Louisiana for
captive breeding; reintroduced at Alligator River NWR, North Carolina, from 1987. The wild
population grew to over a hundred and then collapsed to a few dozen (gunshot, vehicle strikes,
coyote hybridisation). 1980-1987: none in the wild (the curve cannot show a zero). No sourced
pre-decline count. Added for ToLaD#72: the model's own count (188,562, from density x a clade-mean
range) was about 5,000x too high.

Bottlenecks ([[event]], ToLaD#147): the 14 founders (1973-80, Hinton et al. 2013) are not in the data: the file's one point is 2026 (37).
"""

[[event]]
kind    = "bottleneck"
from_ya = 53
to_ya   = 39
title   = "Fourteen founders"
summary = "From 1973 to 1980 about 400 wild canids were caught in Texas and Louisiana; 14 were judged pure red wolves and founded the captive population, and the species was declared extinct in the wild in 1980. Reintroduction to North Carolina began in 1987."
quote   = "From 1973 through 1980, approximately 400 canids were captured and 43 met the morphological standards to be considered red wolves. Breeding experiments were then conducted with those 43 individuals and, eventually, 14 individuals met the criteria established to define the species. These individuals were used as the founders to begin the captive-breeding program [ 7 ]. The red wolf was declared extinct in the wild in 1980"
cite    = "Hinton JW, Chamberlain MJ, Rabon DR (2013). Red wolf (Canis rufus) recovery: a review with suggestions for future research. Animals 3:722-744"
url     = "https://doi.org/10.3390/ani3030722"
grade   = "A"

[[point]]
year  = 2026
n     = 37
lo    = 36
hi    = 38
grade = "B"
kind  = "census"
cite  = "U.S. Fish and Wildlife Service, Red Wolf Recovery Program, population estimate as of August 2026"
url   = "https://www.fws.gov/project/red-wolf-recovery-program"
note  = "'Known/collared (wild): 21. Total estimate (wild): 22-23 adults/subadults, plus 14-15 pups.' n = 22.5 + 14.5, lo/hi = the stated ends."
