species   = "Saiga tatarica"
common    = "Saiga antelope"
component = "wild"
use       = "counts"
scope     = "global, all ages (Kazakhstan, Kalmykia in Russia, Mongolia, Uzbekistan); recent points are Kazakhstan only (~99% of the species)"
notes     = "Poaching for horn and meat after the Soviet collapse drove steep declines (Milner-Gulland et al. 2001, Oryx 35:340-345, doi:10.1046/j.1365-3008.2001.00202.x); ~1.25 M (mid-1970s) to c. 50,000 (2008) is a ~96% fall. Kazakhstan fell to ~21,000 in 2003. A 2015 bacterial die-off killed over 200,000 (more than 60% of the world population). Kazakhstan's aerial censuses (Altyn Dala / Okhotzooprom) have since recorded rapid growth (~48%/yr), and culls began in 2024-25. Kalmykia: 380,000 (1980), 196,000 (1996), 26,000 (2000); Mongolian saiga ~750-5,200 (1998-2004)."

