species   = "Balaenoptera musculus"
common    = "Blue whale"
component = "wild"
use       = "counts"
scope     = "global, all ages (1926 point: mature individuals only)"
notes     = "Pre-whaling and 2001 global numbers are Christensen 2006's reconstruction as tabulated by Pershing et al. 2010 (CC BY). Modern whaling (from c. 1900) took the species to a few percent of its former level; the Antarctic stock fell from 239,000 (202,000-311,000) to a 1973 low of 360 (150-840) and was ~1,700 in 1996 (Branch, Matsuoka & Miyashita 2004, Mar. Mamm. Sci. 20:726-754). That regional low is not used as a global point. IUCN 2018: 5,000-15,000 mature, Endangered."

