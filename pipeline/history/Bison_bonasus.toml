species   = "Bison bonasus"
aliases   = ["Bos bonasus"]
common    = "European bison"
component = "wild"
use       = "counts"
scope     = "global, all ages, all registered animals (free-ranging, semi-wild, enclosures and zoos)"
notes     = """
Extinct in the wild (Bialowieza 1919, Caucasus 1927). The species survived only in captivity, and
every living animal descends from 12 founders. Counts are from the European Bison Pedigree Book,
which registers all animals; in 2024 about 80% were free-ranging. No sourced pre-decline level was
found (the decline ran over centuries), so there is no baseline.
"""

