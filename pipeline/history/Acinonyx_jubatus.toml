species   = "Acinonyx jubatus"
common    = "Cheetah"
component = "wild"
use       = "counts"
scope     = "global wild cheetahs; 1975 figure is sub-Saharan Africa only; recent figures exclude cubs"
notes     = """
'100,000 cheetahs in 1900' is a popular figure with no traceable survey (grade D). Myers 1975 was
the first continental survey (sub-Saharan Africa only; Asiatic cheetahs then numbered a few
hundred). Modern figures: ~7,100 adults and adolescents (Durant et al. 2017) and 6,517 mature
individuals (IUCN 2021/2022). Asiatic cheetah (Iran): fewer than 50 (Farhadinia et al. 2016).

Bottleneck ([[event]], ToLaD#141): the late-Pleistocene crash, 12,589-11,084 years ago in Africa
(Dobrynin et al. 2015, from whole genomes; Menotti-Raymond & O'Brien 1993 had put it near the end of
the last ice age, ~10,000 years ago). It falls in PSMC's blind spot (< 20 kyr), so the bulk genomic
curve (Bergman et al. 2023, whose last point is ~21 kyr ago) cannot show it: the mark stands on the
source alone. The older bottleneck Dobrynin et al. date to more than 100,000 years ago has no dated
window, so it is not marked.
"""

[[event]]
kind    = "bottleneck"
from_ya = 12589
to_ya   = 11084
title   = "Late-Pleistocene crash"
summary = "African cheetahs crashed about 12,000 years ago, when most of the world's large mammals died out at the end of the last ice age. The few survivors left the species with famously little genetic variation."
quote   = "Demographic estimators impute two ancestral population bottlenecks: one >100,000 years ago coincident with cheetah migrations out of the Americas and into Eurasia and Africa, and a second 11,084–12,589 years ago in Africa coincident with late Pleistocene large mammal extinctions."
cite    = "Dobrynin P, Liu S, Tamazian G, et al. (2015). Genomic legacy of the African cheetah, Acinonyx jubatus. Genome Biol 16:277"
url     = "https://doi.org/10.1186/s13059-015-0837-4"
grade   = "C"
region  = "Africa"

[baseline]
year  = 1900
n     = 100000
lo    = 100000
hi    = 100000
grade = "D"
kind  = "unverified"
cite  = "San Diego Zoo Wildlife Alliance, Cheetah fact sheet: 'wild population in Asia and Africa estimated at 100,000 animals' (1900, no source given)"
url   = "https://ielc.libguides.com/sdzg/factsheets/cheetah/population"
note  = "Repeated by zoos, NGOs and press; no primary estimate traced."

