species   = "Loxodonta cyclotis"
common    = "African forest elephant"
component = "wild"
use       = "counts"
scope     = "global, all ages; every point is a regional proxy (Central African rainforests / Central Africa) for the species, see notes"
notes     = "Split from L. africana in 2021; older totals are continental for both species. For all points before 2015 the forest share is assumed equal to the ITRG 1989 share of elephants in the Central African rainforests (45%). IUCN 2021 (Critically Endangered): decline of more than 86% over 31 years. Maisels et al. 2013 (PLoS ONE 8:e59469, doi:10.1371/journal.pone.0059469): -62% over 2002-2011, population under 10% of its potential size. Gabon alone was estimated at 95,110 (95% CI 58,872-131,349) in a nationwide genetic survey (Laguardia et al. 2021), which suggests the guess-based 2015 Central Africa total may be low. All points are grade D."

[baseline]
year  = 1800
n     = 1.17e7
lo    = 1.17e7
hi    = 1.17e7
grade = "D"
kind  = "unverified"
cite  = "US Fish and Wildlife Service, African Elephant Conservation Fund, 'What we do'"
url   = "https://www.fws.gov/program/african-elephant-conservation-fund/what-we-do"
note  = "'During the eighteenth century, the African continent may have contained as many as 26 million elephants' (both species), times the assumed 45% forest share: 2.6e7 x 0.45 = 1.17e7. Widely repeated (FWS, National Geographic education pages; 20-27 M variants elsewhere) with no stated method; research/05 traces it to carrying-capacity and ivory-export reasoning. 'As many as' makes it an upper-end figure."

