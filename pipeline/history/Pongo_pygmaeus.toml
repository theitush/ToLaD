hi    = 288500
grade = "C"
kind  = "reconstruction"
cite  = "Ancrenaz et al. 2016, IUCN Red List, Pongo pygmaeus (doi:10.2305/IUCN.UK.2016-1.RLTS.T17975A17966347.en), as reported by The Jakarta Post 2017"
url   = "https://www.thejakartapost.com/life/2017/05/03/rare-albino-orangutan-rescued-on-borneo-island"
note  = "Back-cast from habitat and density models in the IUCN assessment (288,500 in 1973). Figure confirmed in press coverage only; the assessment text was not read directly."

