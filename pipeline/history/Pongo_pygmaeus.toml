species   = "Pongo pygmaeus"
common    = "Bornean orangutan"
component = "wild"
use       = "counts"
scope     = "global (Borneo), all ages"
notes     = "IUCN 2016 (Ancrenaz et al.) moved the species to Critically Endangered: >60% decline 1950-2010, a projected 86% reduction 1973-2025 and ~47,000 projected for 2025, from habitat-loss models. Voigt et al. 2018 (Current Biology, doi:10.1016/j.cub.2018.01.053) infer a loss of ~148,500 individuals over 1999-2015 from 36,555 nest counts. Totals differ strongly by method: Wich et al. 2008 gave at least 54,000 for 2004, IUCN gave 104,700 for 2012, the 2016 PHVA gave 57,350. The 2004 figure is left out because it is not comparable with the IUCN modelled series."

