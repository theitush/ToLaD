n     = 30
lo    = 30
hi    = 30
grade = "D"
kind  = "census"
cite  = "Larsen CA (1920), as cited in Hoffman JI et al. (2022). Demographic Reconstruction of Antarctic Fur Seals Supports the Krill Surplus Hypothesis. Genes 13:541"
url   = "https://doi.org/10.3390/genes13030541"
note  = "The sealing low: 'Larsen's estimate of 30 individuals at South Georgia in 1911'. South Georgia only; Hoffman et al. 2022 read their bottleneck Ne of ~534 as 'implying that thousands of animals may have escaped sealing at South Georgia', so this is a floor."

