species   = "Arctocephalus gazella"
common    = "Antarctic fur seal"
component = "wild"
use       = "counts"
scope     = "global, all ages (South Georgia holds ~98%)"
notes     = "Sealed to commercial extinction by 1907 (last commercial catch 170 animals at South Georgia in 1908). Points: the pre-sealing level at South Georgia (Foley & Lynch 2020, females only, so a floor for all ages), Larsen's 30 animals there in 1911 (the sealing low; Hoffman et al. 2022 argue from genetics that thousands may have escaped, so it is a floor too), and 12 pups seen in 1936 (Boyd 1993, not a point: no pup-to-total ratio for a colony that small). After it: IUCN 2026 (Forcada, now Endangered), 2,187,000 mature seals in 1999 and 944,000 in 2025, taken to all ages by the ratio in Forcada et al. 2026 (South Georgia 2022: 1,983,687 all ages for 1,024,797 mature, x1.936), and the South Georgia counts of 2007-09 and 2022. Bird Island's mature females fell 7.2%/yr in 2009-2017 (Forcada et al. 2023b, as cited in Forcada et al. 2026); that is one colony, and the island-wide change, -3.93%/yr since 2007 (Forcada et al. 2026), is already in the 2008 and 2022 points, so it is not applied as a trend. Older totals of 4.5-6.2 million in 1999/2000 (SCAR Expert Group on Seals 2008) are judged inflated by Forcada et al. 2023 and not used. Bottlenecks ([[event]], ToLaD#147): the sealing near-extinction (Paijmans et al. 2020, 1775 to the early 20th century) is in the curve through the 1786 and 1911 points; the log-linear fall between them is smoother than the real crash, which was mostly over by the 1820s."

[[event]]
kind    = "bottleneck"
from_ya = 251
to_ya   = 96
title   = "Sealing near-extinction"
scope   = "species"
scope_why = "sealers took the species around the whole Southern Ocean"
summary = "Sealers hunted Antarctic fur seals almost to extinction from 1775 (South Georgia) through the 19th century; at least four relict colonies survived, each with an effective size of around 150-200. Breeding numbers stayed tiny into the early 20th century."
quote   = "a species that was hunted to the brink of extinction by 18th and 19th century sealers. ... show that at least four relict populations around Antarctica survived commercial hunting. Coalescent simulations suggest that all of these populations experienced severe bottlenecks down to effective population sizes of around 150-200."
cite    = "Paijmans AJ, Stoffel MA, Bester MN, et al. (2020). The genetic legacy of extreme exploitation in a polar vertebrate. Sci Rep 10:5089"
url     = "https://doi.org/10.1038/s41598-020-61560-8"
grade   = "C"

[baseline]
year  = 1786
n     = 2500000
lo    = 1500000
hi    = 3500000
grade = "D"
kind  = "reconstruction"
cite  = "Foley CM, Lynch HJ (2020). A method to estimate pre-exploitation population size. Conservation Biology 34:256-265"
url   = "https://doi.org/10.1111/cobi.13416"
note  = "Pre-exploitation South Georgia, from the 1786-1908 harvest record and a stochastic age-structured model: 'the pre-exploitation abundance of Antarctic fur seals on South Georgia was 2.5 million females (95% CI 1.5-3.5 million)'. Females only and South Georgia only, so a floor for all ages; not scaled up, as no cited sex ratio was found."

[[point]]
