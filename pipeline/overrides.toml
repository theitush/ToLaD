# --- The dated tree (ToLaD#145) ---------------------------------------------------

[[dated_clade]]
name = "Panthera"
tree = "((Panthera tigris,Panthera uncia)3.47[2.55,4.43],(Panthera onca,(Panthera leo,Panthera pardus)2.57[1.89,3.28])3.65[2.69,4.66])4.58[3.37,5.84]"
reason = """Upham's tree puts the snow leopard with the lion and leopard and the tiger outside the \
rest (2.34, 1.90 and 4.91 Ma); the genome-wide species tree (64% of windows) has tiger + snow \
leopard vs jaguar + (lion, leopard). Node ages and 95% HPDs are read from Fig. 1A's labels (the \
figure is 313 px wide, so the last digit is +-0.02; research/panthera-split-dates.md)."""
citation = """Figueiró, H.V. et al. (2017). Genome-wide signatures of complex introgression and \
adaptive evolution in the big cats. Science Advances 3: e1700299, Fig. 1A. doi:10.1126/sciadv.1700299"""

[[dated_clade]]
name = "Felis catus"
tree = "(Felis silvestris,Felis catus)0.0095[0.0095,0.0115]"
common = { "Felis catus" = "Domestic cat" }  # the Red List lists no domestic form, so it has no English name there
reason = """The domestic cat is the wildcat's tamed form (from the Near Eastern wildcat), so it parts \
from the wildcat at domestication, not at Upham's 0.94 Ma speciation; the earliest tamed cat was \
buried with a person on Cyprus ~9,500 years ago (Vigne et al. 2004, Science 304: 259)."""
citation = """Driscoll, C.A. et al. (2007). The Near Eastern origin of cat domestication. \
Science 317: 519-523. doi:10.1126/science.1139518"""

