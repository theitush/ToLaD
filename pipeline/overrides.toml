# ToLaD manual overrides for the mammal pipeline.
#
# Every hand-made change to what the pinned sources say lives here, with a
# reason and a citation. The build reads this file (tolad_pipeline/overrides.py),
# applies each entry, fails if an entry no longer matches anything, and writes
# what it applied to data/mammals/stats.json -> overrides.
#
# Bump `version` whenever an entry is added, removed or changed, and say why in
# the commit message.
#
# Sections
#   [[exclude]]    drop a PBDB species record before grafting
#   [[date]]       replace a PBDB first/last appearance (Ma) for one species
#   [[placement]]  move a taxon (an Open Tree node or a PBDB-created group, by
#                  name) out of the clade the taxonomy puts it in, to the stem
#                  of `stem_of`: it becomes a sibling of that clade's crown
#                  inside a "total group" node (see SOURCES.md, "Stem fossils")
#
# Automatic stem re-homing (merge.rehome_stem_fossils) handles the general case
# of fossils older than a molecular crown age without entries here; it is a
# rule, not an override, and its moves are listed in stats.json ->
# stem_rehoming.
#
# The dated tree (format 1.6, ToLaD#145) is Upham et al. 2019's MCC topology
# and node ages, with every other dated species grafted on by a rule
# (tolad_pipeline/dated.py). Its only hand values are these two sections, at
# the end of the file:
#   [[dated_clade]]   replace the dated subtree over the species in `tree` with
#                     `tree`: Newick with each split's age and 95% interval in
#                     Ma, `(a,b)age[lo,hi]`; the species must be exactly the
#                     dated tree's under their common ancestor
#   [[dated_fossil]]  a fossil species branches off `sister`'s lineage at `age`
#                     (default: its own first appearance) instead of by the
#                     rule; `common` names it where the literature does

version = 3

[[exclude]]
name = "Tikitherium copei"
reason = """PBDB still dates it to the Carnian (Tiki Formation, ~237-227 Ma), a ~25 Myr outlier \
against every other PBDB mammal. The type and only specimen, an isolated upper molar, was \
re-described as a Neogene shrew (Soricidae, Crocidurinae) that does not belong to the Triassic \
fauna."""
citation = """Averianov, A.O. & Voyta, L.L. (2024). Putative Triassic stem mammal Tikitherium \
copei is a Neogene shrew. Journal of Mammalian Evolution 31(1). doi:10.1007/s10914-024-09703-w"""

# --- Mammuthus ------------------------------------------------------------------
# PBDB's first-appearance windows for several mammoths are very wide (one
# occurrence spans the whole Late Miocene to Pliocene), and the pipeline uses
# the window midpoint. That put the genus origin at 13.3 Ma via M. subplanifrons.

[[date]]
name = "Mammuthus subplanifrons"
fad = 6.2
lad = 3.75
reason = """PBDB first-appearance window 23.04-3.6 Ma (midpoint 13.3 Ma) comes from a loosely \
dated occurrence. The earliest mammoth records are latest Miocene, ~6.2-5.3 Ma, in southern \
and eastern Africa (e.g. Langebaanweg, ~5 Ma); the species is not known after ~3.75 Ma."""
citation = """Sanders, W.J. (2023). Evolution and Fossil Record of African Proboscidea. \
CRC Press, Boca Raton, pp. 155, 208-212. doi:10.1201/b20016"""

[[date]]
name = "Mammuthus meridionalis"
fad = 2.6
reason = """PBDB first-appearance window 7.246-2.58 Ma (midpoint 4.9 Ma). In Eurasia the \
species first appears at the start of the Pleistocene, ~2.6 Ma, after M. rumanus."""
citation = """Lister, A.M., Sher, A.V., van Essen, H. & Wei, G. (2005). The pattern and process \
of mammoth evolution in Eurasia. Quaternary International 126-128: 49-64. \
doi:10.1016/j.quaint.2004.04.014"""

[[date]]
name = "Mammuthus primigenius"
fad = 0.6
reason = """PBDB first-appearance window 7.246-2.58 Ma (midpoint 4.9 Ma). The woolly mammoth \
evolved from M. trogontherii in NE Siberia in the Middle Pleistocene, by ~0.6-0.5 Ma (0.7-0.4 \
Ma across sources)."""
citation = """Lister, A.M. (2022). Mammoth evolution in the late Middle Pleistocene: the \
Mammuthus trogontherii-primigenius transition in Europe. Quaternary Science Reviews 294: \
107693. doi:10.1016/j.quascirev.2022.107693"""

[[date]]
name = "Mammuthus lamarmorae"
fad = 0.3
lad = 0.04
reason = """PBDB first-appearance window 11.63-5.09 Ma (midpoint 8.4 Ma). The Sardinian dwarf \
mammoth (M. lamarmorai) is late Middle to Late Pleistocene; its youngest specimen is dated to \
roughly 57-29 ka."""
citation = """Palombo, M.R., Zedda, M. & Zoboli, D. (2024). The Sardinian mammoth's \
evolutionary history: lights and shadows. Quaternary 7(1): 10. doi:10.3390/quat7010010"""

# --- Cretaceous metatherians filed under Didelphimorphia ------------------------
# OTT 3.7.3 lists Stagodontidae and Pediomyidae (incertae sedis) under
# Didelphimorphia, and PBDB-grafted Kokopellia and Asiatherium end up there too.
# They are Cretaceous metatherians outside crown Marsupialia. Left in place
# they drag Didelphimorphia (and Didelphidae) back to ~98 Ma.

[[placement]]
name = "Stagodontidae"
stem_of = "Metatheria"
reason = "Late Cretaceous North American metatherians, outside crown Marsupialia."
citation = """Williamson, T.E., Brusatte, S.L. & Wilson, G.P. (2014). The origin and early \
evolution of metatherian mammals: the Cretaceous record. ZooKeys 465: 1-76. \
doi:10.3897/zookeys.465.8178"""

[[placement]]
name = "Pediomyidae"
stem_of = "Metatheria"
reason = "Late Cretaceous North American metatherians, outside crown Marsupialia."
citation = """Williamson, T.E., Brusatte, S.L. & Wilson, G.P. (2014). ZooKeys 465: 1-76. \
doi:10.3897/zookeys.465.8178"""

[[placement]]
name = "Kokopellia"
stem_of = "Metatheria"
reason = "Albian-Cenomanian (~100 Ma) metatherian from Utah, outside crown Marsupialia."
citation = """Williamson, T.E., Brusatte, S.L. & Wilson, G.P. (2014). ZooKeys 465: 1-76. \
doi:10.3897/zookeys.465.8178"""

[[placement]]
name = "Asiatherium"
stem_of = "Metatheria"
reason = "Late Cretaceous Mongolian metatherian (Asiatheriidae), outside crown Marsupialia."
citation = """Williamson, T.E., Brusatte, S.L. & Wilson, G.P. (2014). ZooKeys 465: 1-76. \
doi:10.3897/zookeys.465.8178"""

# --- The dated tree (ToLaD#145) ---------------------------------------------------

[[dated_clade]]
name = "Panthera"
tree = "((Panthera tigris,Panthera uncia)3.47[2.55,4.43],(Panthera onca,(Panthera leo,Panthera pardus)2.57[1.89,3.28])3.65[2.69,4.66])4.58[3.37,5.84]"
reason = """Upham's tree puts the snow leopard with the lion and leopard and the tiger outside the \
rest (2.34, 1.90 and 4.91 Ma); the genome-wide species tree (64% of windows) has tiger + snow \
leopard vs jaguar + (lion, leopard). Node ages and 95% HPDs are read from Fig. 1A's labels (the \
figure is 313 px wide, so the last digit is +-0.02; research/panthera-split-dates.md)."""
citation = """Figueiró, H.V. et al. (2017). Genome-wide signatures of complex introgression and \
adaptive evolution in the big cats. Science Advances 3: e1700299, Fig. 1A. doi:10.1126/sciadv.1700299"""

[[dated_clade]]
name = "Felis catus"
tree = "(Felis silvestris,Felis catus)0.0095[0.0095,0.0115]"
reason = """The domestic cat is the wildcat's tamed form (from the Near Eastern wildcat), so it parts \
from the wildcat at domestication, not at Upham's 0.94 Ma speciation; the earliest tamed cat was \
buried with a person on Cyprus ~9,500 years ago (Vigne et al. 2004, Science 304: 259)."""
citation = """Driscoll, C.A. et al. (2007). The Near Eastern origin of cat domestication. \
Science 317: 519-523. doi:10.1126/science.1139518"""

[[dated_fossil]]
name = "Panthera spelaea"
sister = "Panthera leo"
age = 0.5
lo = 0.392
hi = 0.578
common = "Cave lion"
reason = """The cave lion's nuclear genome dates its split from the lion at 470 ka (392-529 ka; \
X-chromosome PSMC 495 ka, 460-578 ka). The mitogenomes give 1.89 Ma (Barnett et al. 2016)."""
citation = """de Manuel, M. et al. (2020). The evolutionary history of extinct and living lions. \
PNAS 117: 10927-10934, SI Table S3. doi:10.1073/pnas.1919423117"""

[[dated_fossil]]
name = "Panthera zdanskyi"
sister = "Panthera tigris"
common = "Longdan tiger"
reason = """The most primitive member of the tiger lineage (2.55-2.16 Ma); it branches off at its \
first appearance. Several later studies treat it as a synonym of P. palaeosinensis."""
citation = """Mazák, J.H., Christiansen, P. & Kitchener, A.C. (2011). Oldest known pantherine skull \
and evolution of the tiger. PLoS ONE 6: e25483. doi:10.1371/journal.pone.0025483"""

[[dated_fossil]]
name = "Panthera gombaszoegensis"
sister = "Panthera onca"
age = 2.0
lo = 1.5
hi = 2.7
common = "European jaguar"
reason = """Treated as the jaguar's ancestor ("P. onca gombaszoegensis", Hemmer 1971); first \
appearance ~1.9-2.0 Ma (O'Regan 2002; records from ~1.5 Ma to a doubtful >2.7 Ma). Contested: the \
first phylogenetic analysis places it closer to the tiger. The dataset's first appearance (3.96 Ma) \
sits on the old crown date and is not used."""
citation = """Chatar, N., Michaud, M. & Fischer, V. (2022). Not a jaguar after all? Phylogenetic \
affinities and morphology of the Pleistocene felid Panthera gombaszoegensis. Papers in \
Palaeontology 8: e1464. doi:10.1002/spp2.1464"""

[[dated_fossil]]
name = "Panthera balamoides"
sister = "Panthera onca"
common = "Yucatán cave cat"
reason = """Described from Yucatán caves and compared with the jaguar; it branches off the jaguar's \
lineage at its first appearance. Contested: Blaine et al. 2019 and Ruiz-Ramoni et al. 2019 argue it \
is a short-faced bear (Arctotherium)."""
citation = """Stinnesbeck, S.R. et al. (2020). Panthera balamoides and other Pleistocene felids from \
the submerged caves of Yucatán. Historical Biology 32: 930-939. doi:10.1080/08912963.2018.1556649"""
