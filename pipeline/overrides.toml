# --- Hominins (ToLaD#275) -------------------------------------------------------------
# The fan draws no fossil placed by taxonomy only, so the human lineage's extinct relatives (all
# PBDB grafts) were not drawn. Their relationships are argued over, so this is grade-honest: each
# branches off the human lineage (below Homo's crown, `sister` = sapiens + the Sima de los Huesos
# genome Upham calls H. heidelbergensis) at its first appearance ([[date]] above), except where a
# lineage is widely agreed (Paranthropus; Dmanisi and Flores with
# H. erectus; Neanderthals from the modern human lineage, dated by their genomes). Sahelanthropus
# (7.2 Ma) is older than this tree's Homo-Pan split (6.15 Ma), so it sits on the stem of both.

[[dated_fossil]]
name = "Sahelanthropus tchadensis"
sister = ["Homo sapiens", "Pan troglodytes"]
reason = """Possibly the earliest hominin, possibly a stem hominine; this tree's Homo-Pan split (6.15 Ma) \
is younger than its 7.2 Ma first appearance, so it branches off the stem of both."""
citation = """Brunet, M. et al. (2002). A new hominid from the Upper Miocene of Chad, Central Africa. \
Nature 418: 145-151. doi:10.1038/nature00879"""

[[dated_fossil]]
name = "Orrorin tugenensis"
sister = ["Homo sapiens", "Homo heidelbergensis"]
reason = "An early hominin (bipedal femora); it branches off the human lineage at its first appearance."
citation = """Wood, B. & Boyle, E.K. (2016). Hominin taxic diversity: fact or fantasy? American Journal \
of Physical Anthropology 159 (S61): 37-78. doi:10.1002/ajpa.22902"""

[[dated_fossil]]
name = "Ardipithecus kadabba"
sister = ["Homo sapiens", "Homo heidelbergensis"]
reason = "An early hominin; it branches off the human lineage at its first appearance."
