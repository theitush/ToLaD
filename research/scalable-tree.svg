<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="system-ui, sans-serif" font-size="14">
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#445"/></marker>
  </defs>
  <text x="20" y="28" font-size="17" font-weight="700" fill="#112">One set of boxes drives everything</text>

  <!-- once per data -->
  <text x="20" y="62" font-size="12" fill="#667">ONCE (pipeline / worker, at load and on resize)</text>
  <rect x="20" y="72" width="190" height="64" rx="8" fill="#e8f3ec" stroke="#3a8a5c"/>
  <text x="34" y="98" font-weight="600" fill="#112">Tree + populations</text>
  <text x="34" y="118" font-size="12" fill="#334">splits.ts, population.ts</text>

  <rect x="250" y="72" width="200" height="64" rx="8" fill="#e8f3ec" stroke="#3a8a5c"/>
  <text x="264" y="98" font-weight="600" fill="#112">Layout: nested rooms</text>
  <text x="264" y="118" font-size="12" fill="#334">steady.ts + fold.ts gaps</text>

  <rect x="490" y="72" width="190" height="64" rx="8" fill="#fff4dc" stroke="#b9861d"/>
  <text x="504" y="98" font-weight="600" fill="#112">Territories</text>
  <text x="504" y="118" font-size="12" fill="#334">disjoint, nested spans</text>

  <rect x="720" y="72" width="160" height="64" rx="8" fill="#fff4dc" stroke="#b9861d"/>
  <text x="734" y="98" font-weight="600" fill="#112">Active ranges</text>
  <text x="734" y="118" font-size="12" fill="#334">zoom where each fits</text>

  <line x1="210" y1="104" x2="248" y2="104" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="450" y1="104" x2="488" y2="104" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="680" y1="104" x2="718" y2="104" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- per frame -->
  <text x="20" y="190" font-size="12" fill="#667">EVERY FRAME (work is O(what is on screen))</text>
  <rect x="20" y="200" width="190" height="64" rx="8" fill="#e6eefa" stroke="#3b62a8"/>
  <text x="34" y="226" font-weight="600" fill="#112">Camera</text>
  <text x="34" y="246" font-size="12" fill="#334">width zoom, time zoom, pan</text>

  <rect x="300" y="200" width="300" height="64" rx="8" fill="#fde8e8" stroke="#b33a3a" stroke-width="2"/>
  <text x="314" y="226" font-weight="700" fill="#112">The cut</text>
  <text x="314" y="246" font-size="12" fill="#334">walk from the root; stop where too small</text>

  <line x1="210" y1="232" x2="298" y2="232" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M800,136 C800,170 560,170 520,198" fill="none" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M585,136 C585,160 470,170 450,198" fill="none" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="20" y="330" width="200" height="88" rx="8" fill="#f2f2f6" stroke="#556"/>
  <text x="34" y="356" font-weight="600" fill="#112">GPU geometry</text>
  <text x="34" y="376" font-size="12" fill="#334">static world buffers;</text>
  <text x="34" y="394" font-size="12" fill="#334">cut = which ranges to draw</text>

  <rect x="240" y="330" width="200" height="88" rx="8" fill="#f2f2f6" stroke="#556"/>
  <text x="254" y="356" font-weight="600" fill="#112">Names + pictures</text>
  <text x="254" y="376" font-size="12" fill="#334">shown while zoom is in range;</text>
  <text x="254" y="394" font-size="12" fill="#334">no collisions, no flicker</text>

  <rect x="460" y="330" width="200" height="88" rx="8" fill="#f2f2f6" stroke="#556"/>
  <text x="474" y="356" font-weight="600" fill="#112">"+x" and brackets</text>
  <text x="474" y="376" font-size="12" fill="#334">+x = species under a cut node</text>
  <text x="474" y="394" font-size="12" fill="#334">brackets = icicle rows</text>

  <rect x="680" y="330" width="200" height="88" rx="8" fill="#f2f2f6" stroke="#556"/>
  <text x="694" y="356" font-weight="600" fill="#112">Tap = frame(node)</text>
  <text x="694" y="376" font-size="12" fill="#334">fit its territory; fly there</text>
  <text x="694" y="394" font-size="12" fill="#334">(van Wijk-Nuij path, kept)</text>

  <line x1="380" y1="264" x2="120" y2="328" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="264" x2="340" y2="328" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="480" y1="264" x2="560" y2="328" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="520" y1="264" x2="780" y2="328" stroke="#445" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="20" y="452" font-size="12" fill="#667">Green: kept as is. Amber: new, computed once. Red: new, per frame. Grey: rebuilt on top of the cut.</text>
</svg>
